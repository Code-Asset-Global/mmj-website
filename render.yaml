services:
  - type: web
    name: mmj-website
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --timeout 300 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: HTTPS, value: "1"}
      - {key: SECRET_KEY, generateValue: true}
      - {key: SUPABASE_BUCKET, value: mmj-files}
      - {key: DATABASE_URL, sync: false}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_KEY, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: FACULTY_PASSWORD, sync: false}
      - {key: PARTICIPANT_PASSWORD, sync: false}
      - {key: PARTICIPANT2_PASSWORD, sync: false}
      - {key: GROQ_API_KEY, sync: false}
